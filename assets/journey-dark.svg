<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 556" width="700" height="556" role="img" aria-labelledby="journeyTitle journeyDesc">
  <title id="journeyTitle">Engineering path from 2019 to now</title>
  <desc id="journeyDesc">A vertical royal road from 2019 to now: programming foundations, frontend, full-stack, backend and architecture, products and systems, and study in data, economics, and systems.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1410"/>
      <stop offset="1" stop-color="#0F0C0A"/>
    </linearGradient>
    <linearGradient id="spine" gradientUnits="userSpaceOnUse" x1="84" y1="80" x2="84" y2="462">
      <stop offset="0" stop-color="#4A3F32"/>
      <stop offset="0.5" stop-color="#8A6A1E"/>
      <stop offset="1" stop-color="#D4AF37"/>
    </linearGradient>
    <clipPath id="journeyCard">
      <rect x="0" y="0" width="700" height="556" rx="16"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="700" height="556" rx="16" fill="url(#bg)"/>

  <g clip-path="url(#journeyCard)">
