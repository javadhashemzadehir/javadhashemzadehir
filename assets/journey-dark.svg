<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 556" width="700" height="556" role="img" aria-labelledby="journeyTitle journeyDesc">
  <title id="journeyTitle">Engineering path from 2019 to now</title>
  <desc id="journeyDesc">A vertical progression beginning in 2019: programming foundations, frontend engineering, full-stack development, backend and architecture, products and systems, and now data, economics, and intelligent systems. Small squares accumulate at each stage to show layers being added to the system.</desc>

  <defs>
    <pattern id="journeyDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.4" fill="#263041"/>
    </pattern>
    <linearGradient id="journeyFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.45" stop-color="#000000"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <mask id="journeyGridMask">
      <rect width="700" height="556" fill="url(#journeyFade)"/>
    </mask>
    <linearGradient id="spineGradient" gradientUnits="userSpaceOnUse" x1="84" y1="80" x2="84" y2="462">
      <stop offset="0" stop-color="#2C3746"/>
      <stop offset="0.55" stop-color="#3E5486"/>
      <stop offset="1" stop-color="#7AA2F7"/>
    </linearGradient>
    <clipPath id="journeyCard">
      <rect x="0" y="0" width="700" height="556" rx="16"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="700" height="556" rx="16" fill="#0D1117"/>

  <g clip-path="url(#journeyCard)">
    <rect width="700" height="556" fill="url(#journeyDots)" mask="url(#journeyGridMask)" opacity="0.85"/>

    <rect x="48" y="44" width="72" height="32" rx="16" fill="#131A24" stroke="#2A3B5C" stroke-width="1"/>
    <text x="84" y="65" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="0.4" fill="#7AA2F7">2019</text>

    <line x1="84" y1="80" x2="84" y2="462" stroke="url(#spineGradient)" stroke-width="2"/>

    <line x1="96" y1="124" x2="112" y2="124" stroke="#222B38" stroke-width="1.5"/>
    <circle cx="84" cy="124" r="6" fill="#0D1117" stroke="#4A5769" stroke-width="2"/>
    <text x="124" y="131" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="#E9EFF6">Programming foundations</text>
    <rect x="556" y="120" width="7" height="7" rx="1.5" fill="#7AA2F7"/>

    <line x1="96" y1="186" x2="112" y2="186" stroke="#222B38" stroke-width="1.5"/>
    <circle cx="84" cy="186" r="6" fill="#0D1117" stroke="#4A5769" stroke-width="2"/>
    <text x="124" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="#E9EFF6">Frontend engineering</text>
    <rect x="556" y="182" width="7" height="7" rx="1.5" fill="#2C3746"/>
    <rect x="568" y="182" width="7" height="7" rx="1.5" fill="#7AA2F7"/>

    <line x1="96" y1="248" x2="112" y2="248" stroke="#222B38" stroke-width="1.5"/>
    <circle cx="84" cy="248" r="6" fill="#0D1117" stroke="#4A5769" stroke-width="2"/>
    <text x="124" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="#E9EFF6">Full-stack development</text>
    <rect x="556" y="244" width="7" height="7" rx="1.5" fill="#2C3746"/>
    <rect x="568" y="244" width="7" height="7" rx="1.5" fill="#2C3746"/>
    <rect x="580" y="244" width="7" height="7" rx="1.5" fill="#7AA2F7"/>

    <line x1="96" y1="310" x2="112" y2="310" stroke="#222B38" stroke-width="1.5"/>
    <circle cx="84" cy="310" r="6" fill="#0D1117" stroke="#4A5769" stroke-width="2"/>
    <text x="124" y="317" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="#E9EFF6">Backend &amp; architecture</text>
    <rect x="556" y="306" width="7" height="7" rx="1.5" fill="#2C3746"/>
    <rect x="568" y="306" width="7" height="7" rx="1.5" fill="#2C3746"/>
    <rect x="580" y="306" width="7" height="7" rx="1.5" fill="#2C3746"/>
    <rect x="592" y="306" width="7" height="7" rx="1.5" fill="#7AA2F7"/>

    <line x1="96" y1="372" x2="112" y2="372" stroke="#222B38" stroke-width="1.5"/>
    <circle cx="84" cy="372" r="6" fill="#0D1117" stroke="#4A5769" stroke-width="2"/>
    <text x="124" y="379" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="#E9EFF6">Products &amp; systems</text>
    <rect x="556" y="368" width="7" height="7" rx="1.5" fill="#2C3746"/>
    <rect x="568" y="368" width="7" height="7" rx="1.5" fill="#2C3746"/>
    <rect x="580" y="368" width="7" height="7" rx="1.5" fill="#2C3746"/>
    <rect x="592" y="368" width="7" height="7" rx="1.5" fill="#2C3746"/>
    <rect x="604" y="368" width="7" height="7" rx="1.5" fill="#7AA2F7"/>

    <line x1="96" y1="434" x2="112" y2="434" stroke="#2A3B5C" stroke-width="1.5"/>
    <circle cx="84" cy="434" r="6" fill="#7AA2F7" stroke="#7AA2F7" stroke-width="2"/>
    <text x="124" y="441" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#E9EFF6">Data &#183; Economics &#183; Intelligent systems</text>
    <rect x="556" y="430" width="7" height="7" rx="1.5" fill="#2C3746"/>
    <rect x="568" y="430" width="7" height="7" rx="1.5" fill="#2C3746"/>
    <rect x="580" y="430" width="7" height="7" rx="1.5" fill="#2C3746"/>
    <rect x="592" y="430" width="7" height="7" rx="1.5" fill="#2C3746"/>
    <rect x="604" y="430" width="7" height="7" rx="1.5" fill="#2C3746"/>
    <rect x="616" y="430" width="7" height="7" rx="1.5" fill="#7AA2F7"/>

    <rect x="48" y="466" width="72" height="32" rx="16" fill="#7AA2F7"/>
    <text x="84" y="487" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.2" fill="#0D1117">NOW</text>
  </g>

  <rect x="0.5" y="0.5" width="699" height="555" rx="16" fill="none" stroke="#262E3A" stroke-width="1"/>
</svg>
