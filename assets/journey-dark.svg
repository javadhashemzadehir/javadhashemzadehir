    <line x1="40" y1="40" x2="660" y2="40" stroke="#2E2620" stroke-width="1"/>
    <line x1="40" y1="516" x2="660" y2="516" stroke="#2E2620" stroke-width="1"/>

    <rect x="48" y="44" width="72" height="32" rx="4" fill="#241C16" stroke="#5A4C3A" stroke-width="1"/>
