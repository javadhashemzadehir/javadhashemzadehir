<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Javad Hashemzadeh, freelance software developer</title>
  <desc id="heroDesc">A Persepolis-inspired nameplate: stone columns, a gold spear motif for code as craft, and mountains under a desert sunset.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A1A12"/>
      <stop offset="0.55" stop-color="#1A1410"/>
      <stop offset="1" stop-color="#0F0C0A"/>
    </linearGradient>
    <linearGradient id="goldBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A6A1E"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#8A6A1E"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A3F32"/>
      <stop offset="1" stop-color="#2C241C"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8B2E1A"/>
      <stop offset="0.55" stop-color="#E07A3A"/>
      <stop offset="1" stop-color="#F0C060"/>
    </linearGradient>
    <clipPath id="heroCard">
      <rect x="0" y="0" width="900" height="380" rx="16"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="900" height="380" rx="16" fill="url(#sky)"/>

  <g clip-path="url(#heroCard)">
    <!-- distant mountains -->
    <path d="M0 250 L90 190 L160 230 L240 170 L330 220 L410 165 L500 225 L590 175 L680 230 L760 185 L850 235 L900 210 L900 380 L0 380 Z" fill="#1C1612" opacity="0.95"/>
    <path d="M0 280 L120 230 L210 265 L300 215 L420 270 L520 225 L640 275 L760 230 L900 270 L900 380 L0 380 Z" fill="#241C16" opacity="0.9"/>

    <!-- terrace floor -->
    <rect x="0" y="300" width="900" height="80" fill="#1A1511"/>
    <line x1="0" y1="300" x2="900" y2="300" stroke="#3D3428" stroke-width="2"/>
    <line x1="0" y1="318" x2="900" y2="318" stroke="#2E2620" stroke-width="1"/>

    <!-- left column -->
    <rect x="628" y="118" width="28" height="182" fill="url(#stone)"/>
    <rect x="622" y="108" width="40" height="14" rx="2" fill="#5A4C3A"/>
    <ellipse cx="642" cy="104" rx="22" ry="8" fill="#6B5A44"/>
    <ellipse cx="632" cy="100" rx="8" ry="5" fill="#7A684E"/>
    <ellipse cx="652" cy="100" rx="8" ry="5" fill="#7A684E"/>
    <rect x="624" y="292" width="36" height="10" rx="2" fill="#4A3F32"/>

    <!-- right column -->
    <rect x="780" y="118" width="28" height="182" fill="url(#stone)"/>
    <rect x="774" y="108" width="40" height="14" rx="2" fill="#5A4C3A"/>
    <ellipse cx="794" cy="104" rx="22" ry="8" fill="#6B5A44"/>
    <ellipse cx="784" cy="100" rx="8" ry="5" fill="#7A684E"/>
    <ellipse cx="804" cy="100" rx="8" ry="5" fill="#7A684E"/>
    <rect x="776" y="292" width="36" height="10" rx="2" fill="#4A3F32"/>

    <!-- lintel between columns -->
    <rect x="656" y="128" width="124" height="10" fill="#5A4C3A"/>
    <rect x="660" y="124" width="116" height="4" fill="#D4AF37" opacity="0.55"/>

    <!-- brazier + flame -->
    <rect x="698" y="250" width="40" height="8" rx="2" fill="#3D3428"/>
    <path d="M706 250 L710 230 L718 242 L730 224 L734 250 Z" fill="url(#flame)"/>
    <ellipse cx="718" cy="258" rx="18" ry="6" fill="#2A221C"/>

    <!-- spear / code motif -->
    <line x1="560" y1="88" x2="560" y2="292" stroke="url(#goldBar)" stroke-width="3"/>
    <polygon points="560,72 552,96 568,96" fill="#D4AF37"/>
    <rect x="552" y="180" width="16" height="28" rx="2" fill="#8A6A1E" opacity="0.85"/>
    <text x="576" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#D4AF37" opacity="0.8">&lt;/&gt;</text>

    <!-- identity -->
    <rect x="56" y="92" width="42" height="3" rx="1.5" fill="url(#goldBar)"/>
    <text x="56" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="600" letter-spacing="2.8" fill="#D4AF37">FREELANCE DEVELOPER &#183; FREE WARRIOR</text>
    <text x="56" y="188" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" letter-spacing="-0.6" fill="#EDE4D4">Javad Hashemzadeh</text>
    <text x="56" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#B8A88E">The spear is code. The battlefield is technology.</text>
    <text x="56" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#B8A88E">The discipline is engineering.</text>
  </g>

  <rect x="0.5" y="0.5" width="899" height="379" rx="16" fill="none" stroke="#3D3428" stroke-width="1"/>
</svg>
