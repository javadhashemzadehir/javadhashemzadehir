<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Javad Hashemzadeh, Full-Stack Engineer and System Builder</title>
  <desc id="heroDesc">From interface to infrastructure, and toward systems that reason about data, incentives, and uncertainty. A layered diagram shows interface, services, and persistence tiers connected by a data-flow path.</desc>

  <defs>
    <pattern id="heroDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.4" fill="#263041"/>
    </pattern>
    <linearGradient id="heroFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.28" stop-color="#000000"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <mask id="heroGridMask">
      <rect width="900" height="380" fill="url(#heroFade)"/>
    </mask>
    <clipPath id="heroCard">
      <rect x="0" y="0" width="900" height="380" rx="16"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="900" height="380" rx="16" fill="#0D1117"/>

  <g clip-path="url(#heroCard)">
    <rect width="900" height="380" fill="url(#heroDots)" mask="url(#heroGridMask)" opacity="0.9"/>

    <rect x="60" y="100" width="36" height="3" rx="1.5" fill="#7AA2F7"/>
    <text x="60" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="2.4" fill="#7AA2F7">FULL-STACK ENGINEER &#183; SYSTEM BUILDER</text>
    <text x="60" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="50" font-weight="700" letter-spacing="-0.8" fill="#E9EFF6">Javad Hashemzadeh</text>
    <text x="60" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#98A5B6">From interface to infrastructure &#8212; and toward systems</text>
    <text x="60" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#98A5B6">that reason about data, incentives, and uncertainty.</text>

    <rect x="616" y="76" width="236" height="228" rx="14" fill="none" stroke="#222B38" stroke-width="1" stroke-dasharray="4 5"/>

    <rect x="632" y="96" width="204" height="52" rx="10" fill="#131A24" stroke="#222B38" stroke-width="1"/>
    <text x="648" y="127" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="1.4" fill="#98A5B6">INTERFACE</text>
    <rect x="772" y="116" width="12" height="12" rx="3" fill="#7AA2F7"/>
    <rect x="790" y="116" width="12" height="12" rx="3" fill="#2C3746"/>
    <rect x="808" y="116" width="12" height="12" rx="3" fill="#2C3746"/>

    <rect x="632" y="164" width="204" height="52" rx="10" fill="#131A24" stroke="#222B38" stroke-width="1"/>
    <text x="648" y="195" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="1.4" fill="#98A5B6">SERVICES</text>
    <rect x="772" y="184" width="12" height="12" rx="3" fill="#2C3746"/>
    <rect x="790" y="184" width="12" height="12" rx="3" fill="#2C3746"/>
    <rect x="808" y="184" width="12" height="12" rx="3" fill="#2C3746"/>

    <rect x="632" y="232" width="204" height="52" rx="10" fill="#131A24" stroke="#222B38" stroke-width="1"/>
    <text x="648" y="263" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="1.4" fill="#98A5B6">PERSISTENCE</text>
    <rect x="772" y="252" width="12" height="12" rx="3" fill="#2C3746"/>
    <rect x="790" y="252" width="12" height="12" rx="3" fill="#2C3746"/>
    <rect x="808" y="252" width="12" height="12" rx="3" fill="#2C3746"/>

    <line x1="680" y1="148" x2="680" y2="164" stroke="#7AA2F7" stroke-width="1.5"/>
    <line x1="680" y1="216" x2="680" y2="232" stroke="#7AA2F7" stroke-width="1.5"/>
    <circle cx="680" cy="156" r="2.5" fill="#7AA2F7"/>
    <circle cx="680" cy="224" r="2.5" fill="#7AA2F7"/>

    <line x1="780" y1="148" x2="780" y2="164" stroke="#2C3746" stroke-width="1.5"/>
    <line x1="780" y1="216" x2="780" y2="232" stroke="#2C3746" stroke-width="1.5"/>
  </g>

  <rect x="0.5" y="0.5" width="899" height="379" rx="16" fill="none" stroke="#262E3A" stroke-width="1"/>
</svg>
