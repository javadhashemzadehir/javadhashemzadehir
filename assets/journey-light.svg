<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 556" width="700" height="556" role="img" aria-labelledby="journeyTitle journeyDesc">
  <title id="journeyTitle">Engineering path from 2019 to now</title>
  <desc id="journeyDesc">A vertical progression beginning in 2019: programming foundations, frontend engineering, full-stack development, backend and architecture, products and systems, and now data, economics, and intelligent systems. Small squares accumulate at each stage to show layers being added to the system.</desc>

  <defs>
    <pattern id="journeyDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.4" fill="#C9D3E0"/>
    </pattern>
    <linearGradient id="journeyFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.45" stop-color="#000000"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <mask id="journeyGridMask">
      <rect width="700" height="556" fill="url(#journeyFade)"/>
    </mask>
    <linearGradient id="spineGradient" gradientUnits="userSpaceOnUse" x1="84" y1="80" x2="84" y2="462">
      <stop offset="0" stop-color="#CBD5E1"/>
      <stop offset="0.55" stop-color="#A8BEE8"/>
      <stop offset="1" stop-color="#2B5FD9"/>
    </linearGradient>
    <clipPath id="journeyCard">
      <rect x="0" y="0" width="700" height="556" rx="16"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="700" height="556" rx="16" fill="#FFFFFF"/>

  <g clip-path="url(#journeyCard)">
    <rect width="700" height="556" fill="url(#journeyDots)" mask="url(#journeyGridMask)" opacity="0.45"/>

    <rect x="48" y="44" width="72" height="32" rx="16" fill="#F6F8FB" stroke="#C3D2F5" stroke-width="1"/>
    <text x="84" y="65" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="0.4" fill="#2B5FD9">2019</text>

    <line x1="84" y1="80" x2="84" y2="462" stroke="url(#spineGradient)" stroke-width="2"/>

    <line x1="96" y1="124" x2="112" y2="124" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="84" cy="124" r="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <text x="124" y="131" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="#0B1220">Programming foundations</text>
    <rect x="556" y="120" width="7" height="7" rx="1.5" fill="#2B5FD9"/>

    <line x1="96" y1="186" x2="112" y2="186" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="84" cy="186" r="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <text x="124" y="193" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="#0B1220">Frontend engineering</text>
    <rect x="556" y="182" width="7" height="7" rx="1.5" fill="#CBD5E1"/>
    <rect x="568" y="182" width="7" height="7" rx="1.5" fill="#2B5FD9"/>

    <line x1="96" y1="248" x2="112" y2="248" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="84" cy="248" r="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <text x="124" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="#0B1220">Full-stack development</text>
    <rect x="556" y="244" width="7" height="7" rx="1.5" fill="#CBD5E1"/>
    <rect x="568" y="244" width="7" height="7" rx="1.5" fill="#CBD5E1"/>
    <rect x="580" y="244" width="7" height="7" rx="1.5" fill="#2B5FD9"/>

    <line x1="96" y1="310" x2="112" y2="310" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="84" cy="310" r="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <text x="124" y="317" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="#0B1220">Backend &amp; architecture</text>
    <rect x="556" y="306" width="7" height="7" rx="1.5" fill="#CBD5E1"/>
    <rect x="568" y="306" width="7" height="7" rx="1.5" fill="#CBD5E1"/>
    <rect x="580" y="306" width="7" height="7" rx="1.5" fill="#CBD5E1"/>
    <rect x="592" y="306" width="7" height="7" rx="1.5" fill="#2B5FD9"/>

    <line x1="96" y1="372" x2="112" y2="372" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="84" cy="372" r="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <text x="124" y="379" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="500" fill="#0B1220">Products &amp; systems</text>
    <rect x="556" y="368" width="7" height="7" rx="1.5" fill="#CBD5E1"/>
    <rect x="568" y="368" width="7" height="7" rx="1.5" fill="#CBD5E1"/>
    <rect x="580" y="368" width="7" height="7" rx="1.5" fill="#CBD5E1"/>
    <rect x="592" y="368" width="7" height="7" rx="1.5" fill="#CBD5E1"/>
    <rect x="604" y="368" width="7" height="7" rx="1.5" fill="#2B5FD9"/>

    <line x1="96" y1="434" x2="112" y2="434" stroke="#C3D2F5" stroke-width="1.5"/>
    <circle cx="84" cy="434" r="6" fill="#2B5FD9" stroke="#2B5FD9" stroke-width="2"/>
    <text x="124" y="441" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#0B1220">Data &#183; Economics &#183; Intelligent systems</text>
    <rect x="556" y="430" width="7" height="7" rx="1.5" fill="#CBD5E1"/>
    <rect x="568" y="430" width="7" height="7" rx="1.5" fill="#CBD5E1"/>
    <rect x="580" y="430" width="7" height="7" rx="1.5" fill="#CBD5E1"/>
    <rect x="592" y="430" width="7" height="7" rx="1.5" fill="#CBD5E1"/>
    <rect x="604" y="430" width="7" height="7" rx="1.5" fill="#CBD5E1"/>
    <rect x="616" y="430" width="7" height="7" rx="1.5" fill="#2B5FD9"/>

    <rect x="48" y="466" width="72" height="32" rx="16" fill="#2B5FD9"/>
    <text x="84" y="487" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.2" fill="#FFFFFF">NOW</text>
  </g>

  <rect x="0.5" y="0.5" width="699" height="555" rx="16" fill="none" stroke="#D9DFE7" stroke-width="1"/>
</svg>
